# Agent preset: security-review
# A pre-wired stage. Use it from .agentic/config.yml with:
#   stages:
#     - { id: security, from: security-review }
#     - { id: security, from: security-review, provider: openai }   # override provider
# Fields you set on the stage override the preset; the preset overrides toolkit defaults.
type: security
name: Security Review
description: Assesses the diff for security risk (injection, authz, secrets, deps, exposure); gates on high+.
skill: security-review             # -> templates/skills/security-review/SKILL.md
provider: openai                   # OpenAI/Codex is the rendered reviewer; override per stage
gate: blocking
triggers: [pr_opened, pr_updated]
# No model binding: Codex (the OpenAI reviewer) supplies its own model. A `model:` set on a Codex
# stage is ignored — model bindings apply only to the model-consuming provider (anthropic).
