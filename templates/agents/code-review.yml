# Agent preset: code-review
# A pre-wired stage. Use it from .agentic/config.yml with:
#   stages:
#     - { id: review, from: code-review }          # accept defaults
#     - { id: review, from: code-review, provider: openai, model: { default: strong } }  # override
# Fields you set on the stage override the preset; the preset overrides toolkit defaults.
type: review
name: Code Review
description: Reviews the diff for correctness, safety, and maintainability; gates on blockers.
skill: code-review                 # -> templates/skills/code-review/SKILL.md
backend:
  name: generic                    # or pr-agent | claude-code-action | codex
gate: blocking
triggers: [pr_opened, pr_updated]
# Model is intentionally unset so this preset works out of the box: it resolves via the stage's
# provider + `defaults.models` (and tiering). To pin models, set `model:` on the stage that uses
# this preset, or define `models.aliases` and reference them there.
