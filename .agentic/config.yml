# agentic-foundation dogfoods its own contract. This file declares the review pipeline this
# repository wants; the hand-written .github/workflows/ implement it today, and will be replaced
# by workflows generated from this file (`stagr apply`) once the generated pipeline takes over.
# `stagr plan` lists what `stagr apply` would generate from it; nothing generated is committed yet.
# Only keys in stagr/config.schema.json do anything; validate with
# `python .github/scripts/validate_config.py`.
version: 2
profile: custom

platform:
  type: github
  trusted_roles: [owner, member, collaborator]
  labels:
    human_merge: human-merge          # foundation gate hard-stop
  # Publication/remediation uses a real-user PAT; reads use the workflow GITHUB_TOKEN.
  auth: { token_secret: REMEDIATION_TOKEN }
  # The Stagr GitHub App that publishes the check runs the generated workflows emit. The ID is not
  # a secret; the private key lives in the repository secret named below (default shown).
  publisher: { app_id: 5125793, private_key_secret: STAGR_APP_PRIVATE_KEY }

providers:
  # Secret alias map: each key is a SecretRef.alias used in the BackendRenderer's ExecutionPlan;
  # each value is the environment-variable name where the actual secret lives at run time.
  # The values here are secret NAMES (never values); the runtime reads them from the environment.
  openai:
    secrets:
      PROVIDER_API_KEY: OPENAI_API_KEY
      TRUSTED_COMMENTER_TOKEN: REMEDIATION_TOKEN

stages:
  # The two reviews are independent stages: neither waits for the other. (Running the two Codex
  # reviews one after the other is a rule of this repository's own hand-written review process
  # in AGENTS.md; it is not part of the contract this file declares.)

  # Reviewer: Codex code review (via @codex review), gates the PR.
  - id: review
    type: review
    provider: openai
    skill: code-review
    gate: blocking
    triggers: [pr_opened, pr_updated]

  # Reviewer: Codex security review (via @codex security review), gates the PR.
  - id: security
    type: security
    provider: openai
    skill: security-review
    gate: blocking
    triggers: [pr_opened, pr_updated]

# What "green" means for this repo (language-agnostic; here: validate the contract). Not part of
# the schema yet, so it is ignored today; design-docs/09-check-stages.md makes it the home of the
# build and unit-test commands.
build:
  preset: custom
  commands:
    test: "python .github/scripts/validate_config.py"

# Fast-path is DISABLED for this repository: every PR — docs included — is routed to Codex for an
# independent review. This is a shared toolkit whose docs other people rely on, so nothing merges
# without review (see AGENTS.md / CLAUDE.md). Mirrors .github/workflows/fast-ai-code-review.yml.
routing:
  fast_path:
    enabled: false
