name: Request Codex security review (final pre-merge)

# Requests exactly ONE Codex security review, as the FINAL step before merge — after the code review
# has converged (the Codex code review is "Completed" for the current head and there are no unresolved
# review threads). The security review is kept out of the on-push lane
# (request-codex-review-on-push.yml) so the two never run concurrently: Codex's cloud backend errors
# when a code and a security review run at the same time on one PR.
#
# IMPORTANT — the Codex App must be configured to run only the CODE review automatically on PR open
# (not the security review). Whether the App auto-runs a security review on open is a ChatGPT-side App
# setting this toolkit cannot render; if it is left on, the App's native security review races the code
# review on every open and re-hits the same backend concurrency error this workflow exists to prevent.
# This workflow is the SOLE trigger of the security review.
#
# It runs on: comment activity (Codex edits its "Review Summary" comment to "Completed" when the code
# review finishes), completed check suites, and a periodic schedule. The schedule is what re-evaluates
# a head after its last review thread is resolved: GitHub emits NO workflow-triggering event for a
# thread resolve/unresolve (`pull_request_review_thread` is a webhook event but not a valid Actions
# trigger — declaring it fails the whole workflow at startup), so without the scheduled sweep a head
# whose last finding was just resolved would never be re-evaluated and the merge gate would deadlock.
# It performs only GitHub API work (reads the PR, its review threads, and Codex's summary comment; posts
# one comment) — no PR content is checked out or executed. The comment is posted with the
# narrowly-scoped remediation PAT so it is authored by a trusted user (Codex honours "@codex" commands
# from a real user).
on:
  issue_comment:
    types: [created, edited]
  check_suite:
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pull-requests: read

# Serialize EVERY run of this workflow repo-wide onto one concurrency group so no two runs — a scheduled
# sweep and an event-driven run, or two sweeps — ever execute at the same time. The per-head idempotency
# marker below is a check-then-post, NOT an atomic lock: two runs executing concurrently could both read
# "marker absent" and both post `@codex security review`, starting duplicate paid reviews and the very
# concurrent code/security run this workflow exists to prevent. A single global group closes that race;
# a per-PR group cannot, because a sweep evaluates many PRs in one run and so must fall back to the run
# id, landing in a different group from a same-PR event run. `cancel-in-progress: false` lets an
# in-flight sweep finish instead of being killed by a new event: runs queue and execute one after
# another, each reading the previous run's freshly-posted marker, so the marker check is reliable. If a
# burst drops a queued event-driven run (GitHub keeps only the latest pending per group), the */15 sweep
# re-evaluates it — bounded latency, never a lost or duplicated review.
concurrency:
  group: request-codex-security
  cancel-in-progress: false

jobs:
  request-security:
    name: Request the final Codex security review once the code review has converged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the security review when ready
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_PAT: ${{ secrets.REMEDIATION_TOKEN }}
          CODEX_BOT_LOGIN: chatgpt-codex-connector[bot]
          TRUSTED_ROLES: '["OWNER","MEMBER","COLLABORATOR"]'
          DEFAULT_BRANCH: "main"
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request.url != '' }}
          CHECK_SUITE_SHA: ${{ github.event.check_suite.head_sha }}
        run: |
          set -euo pipefail

          if [[ -z "${CODEX_PAT:-}" ]]; then
            echo "REMEDIATION_TOKEN is not configured; cannot request a security review as a trusted user. Skipping."
            exit 0
          fi

          REPO="$GITHUB_REPOSITORY"
          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"

          # Resolve the PAT account's own login ONCE (shared by every PR the sweep evaluates) so the
          # idempotency marker is honoured ONLY on a comment authored by that exact account. Matching by
          # author_association alone is too weak (any other trusted-role commenter could paste the marker)
          # and too brittle (if the PAT account's association is outside platform.trusted_roles, the
          # workflow would ignore its own marker and re-post on every issue_comment).
          PAT_LOGIN="$(GH_TOKEN="$CODEX_PAT" gh api user --jq '.login' 2>/dev/null || echo "")"
          [[ -n "$PAT_LOGIN" ]] || { echo "Cannot resolve the PAT account login; skipping to avoid an unauthenticated marker check."; exit 0; }

          # count_unresolved_threads <pr>: number of unresolved review threads (any author), PAGINATED.
          # A single first:100 page can miss unresolved findings on a heavily reviewed PR and spend the
          # paid security review before the code review is actually clean; walk every page. Mirrors the
          # auto-merge gate's paginated counter. Returns non-zero on API error (fail-closed: caller waits).
          count_unresolved_threads() {
            local pr="$1" q cursor="null" resp total=0 page has_next
            q='query($owner:String!,$repo:String!,$number:Int!,$cursor:String){
                 repository(owner:$owner,name:$repo){
                   pullRequest(number:$number){
                     reviewThreads(first:100,after:$cursor){
                       nodes{ isResolved }
                       pageInfo{ hasNextPage endCursor }
                     }}}}'
            while :; do
              if [[ "$cursor" == "null" ]]; then
                resp="$(gh api graphql -f query="$q" -f owner="$OWNER" -f repo="$NAME" -F number="$pr")" || return 1
              else
                resp="$(gh api graphql -f query="$q" -f owner="$OWNER" -f repo="$NAME" -F number="$pr" -f cursor="$cursor")" || return 1
              fi
              page="$(jq -r '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved==false)] | length' <<<"$resp")" || return 1
              total=$((total + page))
              has_next="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"$resp")"
              [[ "$has_next" == "true" ]] || break
              cursor="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor' <<<"$resp")"
            done
            echo "$total"
          }

          # evaluate_pr <pr>: evaluate ONE PR and, if the code review has converged clean on its current
          # head, request exactly one final security review. Every skip path returns 0 (a skip is not an
          # error) so a whole-repo sweep continues to the next PR; only an unexpected failure of the final
          # post surfaces as a non-zero return.
          evaluate_pr() {
            local PR_NUMBER="$1"
            local PR_JSON state draft head_repo base_ref author_assoc head_sha MARKER COMMENTS_JSON
            local summary code_row code_sha sec_row sec_sha unresolved current_head

            PR_JSON="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")" || { echo "Cannot read PR #${PR_NUMBER}; skipping."; return 0; }
            state="$(jq -r '.state' <<<"$PR_JSON")"
            draft="$(jq -r '.draft' <<<"$PR_JSON")"
            head_repo="$(jq -r '.head.repo.full_name' <<<"$PR_JSON")"
            base_ref="$(jq -r '.base.ref' <<<"$PR_JSON")"
            author_assoc="$(jq -r '.author_association' <<<"$PR_JSON")"
            head_sha="$(jq -r '.head.sha' <<<"$PR_JSON")"

            # Same eligibility guard as the on-push lane: open, non-draft, same-repo head, default base,
            # trusted author. Fork PRs and untrusted authors never drive an automated review request.
            [[ "$state" == "open" && "$draft" == "false" && "$head_repo" == "$REPO" && "$base_ref" == "$DEFAULT_BRANCH" ]] \
              || { echo "PR #${PR_NUMBER} not eligible (state/draft/fork/base); skipping."; return 0; }
            printf '%s' "$TRUSTED_ROLES" | jq -e --arg a "$author_assoc" 'index($a) != null' >/dev/null 2>&1 \
              || { echo "PR #${PR_NUMBER}: author association '$author_assoc' is not trusted; skipping."; return 0; }

            # Durable, per-head idempotency marker. Our own request comment carries it (invisible HTML
            # comment), so once a request has been posted for this head, every later run — including the
            # issue_comment:created event fired by our own comment, rapid unrelated comments, and every
            # scheduled sweep — detects it and does nothing. This is what guarantees "exactly one security
            # review per head"; the concurrency group only serializes/cancels runs and gives no durable
            # idempotency.
            #
            # The marker is honoured ONLY on a comment authored by the PAT account resolved above, so a
            # public head SHA pasted by anyone else — trusted-role or not — cannot suppress the mandatory
            # security review, and the check is independent of platform.trusted_roles.
            MARKER="<!-- agentic-foundation:final-security-review-requested:${head_sha} -->"

            # Read PR issue comments once (paginated) for both the idempotency marker and the Codex summary.
            COMMENTS_JSON="$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" --slurp \
              | jq 'add // []')" || { echo "PR #${PR_NUMBER}: cannot read comments; skipping."; return 0; }

            if jq -e --arg m "$MARKER" --arg login "$PAT_LOGIN" \
                 'any(.[]?; (.user.login == $login) and ((.body // "") | contains($m)))' \
                 <<<"$COMMENTS_JSON" >/dev/null; then
              echo "PR #${PR_NUMBER}: security review already requested for head ${head_sha} (marker present from the PAT account); nothing to do."; return 0
            fi

            # The latest Codex "Review Summary" comment carries the per-review status rows.
            summary="$(jq -r --arg bot "$CODEX_BOT_LOGIN" \
              '[ .[] | select(.user.login==$bot) | .body | select(contains("codex-pull-request-review-summary")) ] | last // ""' <<<"$COMMENTS_JSON")"
            [[ -n "$summary" ]] || { echo "PR #${PR_NUMBER}: no Codex review summary yet (code review has not run); skipping."; return 0; }

            # The code review must be Completed for the CURRENT head before security runs.
            code_row="$(grep -i 'Code Review' <<<"$summary" | head -1 || true)"
            grep -qi 'Completed' <<<"$code_row" || { echo "PR #${PR_NUMBER}: code review is not yet completed for this head; skipping."; return 0; }
            code_sha="$(grep -oE '`[0-9a-f]{7,40}`' <<<"$code_row" | head -1 | tr -d '`' || true)"
            [[ -n "$code_sha" && "$head_sha" == "$code_sha"* ]] || { echo "PR #${PR_NUMBER}: code review is bound to a different head; skipping."; return 0; }

            # Belt-and-suspenders on top of the marker: if Codex has already flipped the Security Review
            # row to Running/Completed for this head, there is nothing to do.
            sec_row="$(grep -i 'Security Review' <<<"$summary" | head -1 || true)"
            sec_sha="$(grep -oE '`[0-9a-f]{7,40}`' <<<"$sec_row" | head -1 | tr -d '`' || true)"
            if [[ -n "$sec_sha" && "$head_sha" == "$sec_sha"* ]] && grep -qiE 'Completed|Running' <<<"$sec_row"; then
              echo "PR #${PR_NUMBER}: security review already requested/completed for head ${head_sha}; nothing to do."; return 0
            fi

            # The code review must be CLEAN: no unresolved review threads (paginated). A finding leaves a
            # thread; we wait for it to be addressed before spending the final security review on this head.
            unresolved="$(count_unresolved_threads "$PR_NUMBER")" || { echo "PR #${PR_NUMBER}: cannot read review threads; skipping."; return 0; }
            [[ "$unresolved" == "0" ]] || { echo "PR #${PR_NUMBER}: code review has ${unresolved} unresolved thread(s); waiting before the security review. Skipping."; return 0; }

            # Re-check the PR head immediately before posting. If a push landed after head_sha was read,
            # the comment would attach to the now-updated PR and Codex would review the new head while the
            # on-push lane simultaneously requests its code review — recreating the concurrent code/security
            # run this workflow exists to prevent. Abort unless the head is still head_sha; the new head's
            # own events will drive the flow.
            current_head="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')" || { echo "PR #${PR_NUMBER}: cannot re-read PR head before posting; skipping."; return 0; }
            [[ "$current_head" == "$head_sha" ]] || { echo "PR #${PR_NUMBER}: head moved to ${current_head} after evaluation; a later event will re-evaluate. Skipping."; return 0; }

            # Ready: request the single final security review, authored by the trusted PAT user. The
            # invisible marker makes this head's request idempotent for every subsequent run.
            {
              echo '@codex security review'
              echo
              echo "_Final pre-merge security review for head \`${head_sha}\` — the code review has completed clean. Requested once, after the code review, never concurrently._"
              echo
              echo "$MARKER"
              echo
              echo '---'
              echo '_Generated by [Claude Code](https://claude.ai/code)_'
            } > "$RUNNER_TEMP/comment.md"
            GH_TOKEN="$CODEX_PAT" gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
            echo "Requested the final Codex security review for head ${head_sha} on PR #${PR_NUMBER}."
          }

          # Resolve the target PR(s) from whichever event fired, then evaluate.
          if [[ -n "${ISSUE_NUMBER:-}" ]]; then
            [[ "${IS_PR_COMMENT}" == "true" ]] || { echo "Comment is not on a pull request; nothing to do."; exit 0; }
            evaluate_pr "${ISSUE_NUMBER}"
          elif [[ -n "${CHECK_SUITE_SHA:-}" ]]; then
            pr="$(gh api "repos/${REPO}/commits/${CHECK_SUITE_SHA}/pulls" \
                  --jq '[.[] | select(.state=="open")] | (first // {}) | .number // ""' 2>/dev/null || echo "")"
            if [[ -n "$pr" ]]; then evaluate_pr "$pr"; else echo "No open PR for check_suite head ${CHECK_SUITE_SHA}; nothing to do."; fi
          else
            # Scheduled sweep (no event-specific PR): walk every open PR targeting the default branch and
            # evaluate each. This is what re-evaluates a head after its last review thread is resolved,
            # for which GitHub emits no workflow-triggering event. The per-head marker keeps it idempotent,
            # and evaluate_pr never errors on a skip, so one problematic PR cannot abort the sweep.
            prs="$(gh api --paginate "repos/${REPO}/pulls?state=open&base=${DEFAULT_BRANCH}&per_page=100" --jq '.[].number')" \
              || { echo "Cannot list open PRs for the scheduled sweep; skipping."; exit 0; }
            for pr in $prs; do evaluate_pr "$pr" || echo "PR #${pr}: evaluation returned non-zero; continuing the sweep."; done
          fi
