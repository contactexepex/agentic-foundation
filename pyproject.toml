# Packaging for the `stagr` CLI. `pipx install stagr` (once published) or, from a checkout,
# `pipx install .`, gives a `stagr` command on Linux, macOS and Windows.
#
# The toolkit's data (config.schema.json + the templates/ tree) lives INSIDE the `stagr`
# package, so it ships in the wheel and resolves the same way in a source checkout and when
# installed — no repository layout is assumed at runtime.
[build-system]
# Pin the build backend so every build (CI, `pip install .`, and `python -m build`, which installs
# the backend into an isolated env from THIS list) resolves a known version rather than whatever is
# newest — supply-chain hardening for the hosted runner.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "stagr"
dynamic = ["version"]
description = "A control plane that turns one declarative file into a governed, multi-stage agentic SDLC pipeline on your existing CI/SCM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4",
]
keywords = ["agentic", "sdlc", "ci", "pipeline", "control-plane", "codex", "code-review"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Build Tools",
  "Intended Audience :: Developers",
]

# NOTE (pre-publish): add a LICENSE file and set `license`/a license classifier here before
# publishing to PyPI. Nothing is published by this change.

[project.scripts]
stagr = "stagr.cli:main"

[project.urls]
Repository = "https://github.com/contactexepex/agentic-foundation"

[tool.hatch.version]
path = "stagr/__init__.py"

[tool.hatch.build.targets.wheel]
# Ship the code AND its data (schema + templates) as one importable package.
packages = ["stagr"]

[tool.hatch.build.targets.sdist]
# The source distribution carries the package plus what a contributor needs to validate it.
include = [
  "stagr/",
  "docs/",
  "README.md",
  "AGENTS.md",
  "CLAUDE.md",
]
