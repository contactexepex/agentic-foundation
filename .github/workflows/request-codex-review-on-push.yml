name: Request Codex review on push

# Keeps Codex's CODE review bound to the CURRENT head of a substantive PR, so review iterates as the
# PR is updated.
#
# Codex re-reviews a PR on open / ready-for-review / an "@codex review" comment — but NOT on a plain
# push. The foundation auto-merge gate (`auto-merge-foundation-prs.yml`) requires a Codex code review
# of the current head, so after every push to an open, non-draft, substantive PR this workflow asks
# Codex to re-review that new head; otherwise the head would carry only a stale review and the gate
# would (correctly, but permanently) refuse to merge it. It requests the CODE review ONLY — the
# SECURITY review runs once, as the final step before merge, from request-final-security-review.yml,
# so the two never run concurrently (Codex's cloud backend errors on a concurrent pair).
#
# It runs as pull_request_target so the trusted workflow definition comes from the base branch, and
# it performs only GitHub API work (reads the PR + the router status, posts one comment) — no PR
# content is checked out or executed. The comment is posted with the narrowly-scoped remediation PAT
# so it is authored by a trusted user (Codex honours "@codex" commands from a real user); a comment
# posted by the workflow's own GITHUB_TOKEN would not reliably trigger Codex.
#
# Triggers:
#   * pull_request_target: synchronize — a new push; the primary path that binds the code review to
#     the new head.
#   * issue_comment: edited + check_suite: completed — re-evaluate a possibly-stranded head when a
#     security review finishes. The on-push lane fail-closes (skips WITHOUT requesting the code
#     review) if a security review is still Running at its wait deadline, so a head pushed during a
#     long security review can be left with no code review until another push. Codex edits its
#     "Review Summary" comment (Running -> Completed) and a check suite completes when the security
#     review clears; those events let this lane re-run and request the code review for the stranded
#     head. The in-script stranding guard makes every such event a no-op unless the head is genuinely
#     stranded, so there is no request loop and no concurrent code+security pair.
#   * We deliberately do NOT listen to issue_comment: created — our own posted "@codex review" comment
#     is a `created` event, so subscribing to it would self-trigger this workflow.
on:
  pull_request_target:
    types: [synchronize]
  issue_comment:
    types: [edited]
  check_suite:
    types: [completed]

# Reads (PR head + router status) use GITHUB_TOKEN, which carries statuses:read; the comment is
# written with the PAT below, not GITHUB_TOKEN.
permissions:
  contents: read
  pull-requests: read
  statuses: read

# One request per PR; a newer event supersedes an in-flight run so only the latest head is asked
# for. The group resolves to the SAME value (the PR number) for every event type, so runs for one PR
# cancel each other regardless of which event fired.
concurrency:
  group: request-codex-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.check_suite.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  request-review:
    name: Ask Codex to re-review the pushed head
    runs-on: ubuntu-latest
    # Budget covers the router wait (≤120s) plus the security-review serialization wait (≤180s).
    timeout-minutes: 10
    steps:
      - name: Post @codex review for the current head
        shell: bash
        env:
          # Reads (PR head, router commit status) run under the workflow's own GITHUB_TOKEN, which
          # carries the statuses:read scope the remediation PAT does not have — a PAT-authenticated
          # status read would 403 and silently defeat the router-fast-path optimisation.
          GH_TOKEN: ${{ github.token }}
          # A real-user PAT (Contents R/W + Pull requests R/W): the comment must be authored by a
          # trusted user for Codex to act on the "@codex" commands, so the posts below use it.
          CODEX_PAT: ${{ secrets.REMEDIATION_TOKEN }}
          CODEX_BOT_LOGIN: chatgpt-codex-connector[bot]
          TRUSTED_ROLES: '["OWNER","MEMBER","COLLABORATOR"]'
          DEFAULT_BRANCH: "main"
          PR_FROM_SYNC: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request.url != '' }}
          CHECK_SUITE_SHA: ${{ github.event.check_suite.head_sha }}
        run: |
          set -euo pipefail

          # Without the PAT the request can only be authored by github-actions[bot], which Codex does
          # not reliably act on; skip cleanly rather than post a comment that does nothing.
          if [[ -z "${CODEX_PAT:-}" ]]; then
            echo "::warning::REMEDIATION_TOKEN is not configured; Codex code+security re-review will NOT be requested for pushed heads. Substantive PRs will not become mergeable until it is set."
            exit 0
          fi

          # Resolve the PR number from whichever event fired.
          PR_NUMBER=""
          if [[ -n "${PR_FROM_SYNC:-}" && "${PR_FROM_SYNC}" != "null" ]]; then
            PR_NUMBER="${PR_FROM_SYNC}"
          elif [[ -n "${ISSUE_NUMBER:-}" ]]; then
            [[ "${IS_PR_COMMENT}" == "true" ]] || { echo "Comment is not on a pull request; nothing to do."; exit 0; }
            PR_NUMBER="${ISSUE_NUMBER}"
          elif [[ -n "${CHECK_SUITE_SHA:-}" ]]; then
            PR_NUMBER="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CHECK_SUITE_SHA}/pulls" \
              --jq '[.[] | select(.state=="open")] | (first // {}) | .number // ""' 2>/dev/null || echo "")"
          fi
          [[ -n "$PR_NUMBER" ]] || { echo "No open PR resolved from this event; nothing to do."; exit 0; }

          # Read the PR and enforce eligibility IN-SCRIPT (a job-level `if:` cannot: the PR fields are
          # null for the issue_comment/check_suite re-trigger events). Same guard as the security lane:
          # open, non-draft, same-repo head, default base, trusted author. Fork PRs and untrusted
          # authors never drive an automated review request.
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")" || { echo "Cannot read PR #${PR_NUMBER}; skipping."; exit 0; }
          state="$(jq -r '.state' <<<"$PR_JSON")"
          draft="$(jq -r '.draft' <<<"$PR_JSON")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$PR_JSON")"
          base_ref="$(jq -r '.base.ref' <<<"$PR_JSON")"
          author_assoc="$(jq -r '.author_association' <<<"$PR_JSON")"
          head_sha="$(jq -r '.head.sha' <<<"$PR_JSON")"
          [[ "$state" == "open" && "$draft" == "false" && "$head_repo" == "$GITHUB_REPOSITORY" && "$base_ref" == "$DEFAULT_BRANCH" ]] \
            || { echo "PR #${PR_NUMBER} not eligible (state/draft/fork/base); skipping."; exit 0; }
          printf '%s' "$TRUSTED_ROLES" | jq -e --arg a "$author_assoc" 'index($a) != null' >/dev/null 2>&1 \
            || { echo "Author association '$author_assoc' is not trusted; skipping."; exit 0; }

          # Ignore a stale synchronize event: if a newer commit has landed since this push event fired,
          # let that commit's own run request the review for the current head. EVENT_HEAD_SHA is empty
          # for the re-trigger events, so this optimisation applies to synchronize only; from here on
          # head_sha (the current head read from the API) is the single source of truth.
          if [[ -n "${EVENT_HEAD_SHA:-}" && "$EVENT_HEAD_SHA" != "$head_sha" ]]; then
            echo "Event is stale; PR head has moved to ${head_sha}. A later run will request the review."
            exit 0
          fi

          # Stranding guard + per-head request marker — the core of the re-trigger logic. This is what
          # makes the issue_comment:edited / check_suite:completed events cheap no-ops unless the head
          # is genuinely stranded, and what prevents a request loop:
          #   * The Codex "Review Summary" Code Review row: once Codex flips it to Running (and later
          #     Completed) for the current head, the head is NOT stranded (Codex is on it / done), so we
          #     exit. Because our own request makes Codex edit the summary to Running, every subsequent
          #     edit event is a no-op — no loop.
          #   * The durable invisible per-head marker on our own request comment covers the window
          #     between posting the request and Codex first updating the summary, so a re-trigger that
          #     fires in that window does not double-request.
          # We listen to issue_comment:edited (not :created) precisely so our own request comment — a
          # `created` event — never self-triggers this workflow.
          COMMENTS_JSON="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --slurp \
            | jq 'add // []')" || { echo "Cannot read PR comments; skipping."; exit 0; }
          summary="$(jq -r --arg bot "$CODEX_BOT_LOGIN" \
            '[ .[] | select(.user.login==$bot) | .body | select(contains("codex-pull-request-review-summary")) ] | last // ""' <<<"$COMMENTS_JSON")"
          code_row="$(grep -i 'Code Review' <<<"$summary" | head -1 || true)"
          code_sha="$(grep -oE '`[0-9a-f]{7,40}`' <<<"$code_row" | head -1 | tr -d '`' || true)"
          if [[ -n "$code_sha" && "$head_sha" == "$code_sha"* ]] && grep -qiE 'Completed|Running' <<<"$code_row"; then
            echo "Code review already completed/running for head ${head_sha}; nothing to do."; exit 0
          fi

          PAT_LOGIN="$(GH_TOKEN="$CODEX_PAT" gh api user --jq '.login' 2>/dev/null || echo "")"
          [[ -n "$PAT_LOGIN" ]] || { echo "Cannot resolve the PAT account login; skipping to avoid an unauthenticated marker check."; exit 0; }
          MARKER="<!-- agentic-foundation:code-review-requested:${head_sha} -->"
          if jq -e --arg m "$MARKER" --arg login "$PAT_LOGIN" \
               'any(.[]?; (.user.login == $login) and ((.body // "") | contains($m)))' \
               <<<"$COMMENTS_JSON" >/dev/null; then
            echo "Code review already requested for head ${head_sha} (marker present from the PAT account); nothing to do."; exit 0
          fi

          # Skip trivial changes: the review router fast-path approves docs/text changes without Codex,
          # and the auto-merge gate's trivial lane does not require a Codex review, so requesting a full
          # code + security review would just burn model budget.
          #
          # The router (fast-ai-code-review.yml) runs on the same synchronize event, independently, so
          # its status for this head may not be published yet when this job starts. A single early read
          # would see no status and fall through to requesting paid reviews even for a trivial change.
          # So wait (bounded) for the router to reach a terminal state for THIS head before deciding.
          # The router is a fast, deterministic, no-model job, so this adds only a few seconds. If it
          # never settles within the budget, fall through and request the review (fail-safe). For a
          # re-trigger event the router status for head_sha is already terminal, so this returns at once.
          ROUTER_STATE=""
          ROUTER_DESC=""
          router_deadline=$(( SECONDS + 120 ))
          while (( SECONDS < router_deadline )); do
            router_line="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/status" \
              --jq '[.statuses[] | select(.context=="Publish fast review result")] | (sort_by(.updated_at, .id) | last) // {} | ((.state // "") + "\t" + (.description // ""))' 2>/dev/null || printf '\t')"
            ROUTER_STATE="${router_line%%$'\t'*}"
            ROUTER_DESC="${router_line#*$'\t'}"
            # Terminal router states; "pending" (still classifying) or "" (not published yet) keep waiting.
            case "$ROUTER_STATE" in
              success|failure|error) break ;;
            esac
            sleep 6
          done

          if [[ "$ROUTER_DESC" == *"fast-path approved"* ]]; then
            echo "Router fast-path approved this head (trivial change); not requesting a Codex review."
            exit 0
          fi
          case "$ROUTER_STATE" in
            success)
              : ;; # Substantive change routed to Codex — request the review below.
            failure|error)
              # The auto-merge gate requires the router status itself to be successful, so a Codex
              # review cannot make this head mergeable until routing is repaired/rerun. Requesting
              # paid reviews now would just burn model budget; stop.
              echo "Router status is '${ROUTER_STATE}' for ${head_sha}; the head cannot become mergeable until routing is fixed. Not requesting a Codex review."
              exit 0 ;;
            *)
              # Missing/pending/timed-out (never reached a terminal state within the budget): fail-safe
              # — request the review rather than risk skipping a needed one.
              echo "Router did not publish a terminal status for ${head_sha} within the budget (state='${ROUTER_STATE:-none}'); requesting review anyway (fail-safe)." ;;
          esac

          # The router wait can span a new push; re-confirm the head has not moved so a superseded run
          # does not request a review for a stale commit.
          current_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ "$current_head" != "$head_sha" ]]; then
            echo "Head moved to ${current_head} during the router wait; a later run will request the review."
            exit 0
          fi

          # Serialize against the final security review — FAIL-CLOSED. If a push lands while the final
          # security review is Running, requesting the code review now would run the two concurrently and
          # hit Codex's backend collision — the very failure this pipeline exists to avoid. Wait (bounded)
          # for any in-flight security review on this PR to stop; if it is STILL running at the deadline,
          # or its state cannot be read, SKIP this run rather than post — deliberately starting a known
          # concurrent pair is never safe. A later push re-requests the head-bound code review once
          # security has stopped.
          sec_deadline=$(( SECONDS + 180 ))
          while :; do
            if ! sec_comments="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --slurp 2>/dev/null)"; then
              echo "Cannot read PR comments to check security-review state; skipping to avoid a concurrent pair. A later push will re-request the code review."
              exit 0
            fi
            if ! sec_summary="$(jq -r '[ add[]? | select(.user.login=="chatgpt-codex-connector[bot]") | .body | select(contains("codex-pull-request-review-summary")) ] | last // ""' <<<"$sec_comments" 2>/dev/null)"; then
              echo "Cannot parse PR comments to check security-review state; skipping to avoid a concurrent pair."
              exit 0
            fi
            sec_row="$(grep -i 'Security Review' <<<"$sec_summary" | head -1 || true)"
            # No security row, or it is not Running -> safe to request the code review.
            grep -qi 'Running' <<<"$sec_row" || break
            if (( SECONDS >= sec_deadline )); then
              echo "A Codex security review is still running on PR #${PR_NUMBER} after the wait budget; skipping to avoid a concurrent pair. A later push re-requests the code review once security stops."
              exit 0
            fi
            echo "A Codex security review is still running on PR #${PR_NUMBER}; waiting before requesting the code review to avoid a concurrent pair."
            sleep 10
          done

          # Ask Codex to re-review the new head — CODE review only — so the gate can evaluate this
          # exact commit. The SECURITY review is NOT requested here: it runs once, as the final step
          # before merge, from request-final-security-review.yml. Keeping the two apart is deliberate —
          # Codex's cloud backend errors when a code and a security review run concurrently on one PR.
          # The invisible marker makes this head's request idempotent for every subsequent run.
          post_codex() {
            local command="$1"
            {
              echo "$command"
              echo
              echo "_Automated re-review request for head \`${head_sha}\` so the foundation auto-merge gate can evaluate this exact commit._"
              echo
              echo "$MARKER"
              echo
              echo '---'
              echo '_Generated by [Claude Code](https://claude.ai/code)_'
            } > "$RUNNER_TEMP/comment.md"
            # Post as the trusted PAT user, not the workflow token, so Codex acts on the command.
            GH_TOKEN="$CODEX_PAT" gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          }
          post_codex '@codex review'
          echo "Requested Codex code re-review for ${head_sha} on PR #${PR_NUMBER}."
