name: Fast AI Code Review

# Deterministic review router — no model call, no secrets.
#
# The fast-path lane is DISABLED for this repository (.agentic/config.yml -> routing.fast_path.enabled:
# false): every PR — documentation included — is routed to Codex, the independent reviewer. This is a
# shared toolkit whose docs other people rely on, so no change merges without review. (The fast-path
# remains a toolkit capability other repos can enable; it is simply off here.)
#
# It runs as pull_request_target so the trusted workflow definition comes from the base branch and the
# required `Publish fast review result` status can be published on the PR head. No PR content is checked
# out or executed, and no repository secret is used. The merge gate reads the resulting success status
# and then requires a head-bound Codex code review; every Codex finding blocks the merge as a thread.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

# One active routing run per PR. A base retarget (edited with a base change) re-routes because it
# changes the effective diff; title/body-only edits publish no status and are isolated here.
concurrency:
  group: fast-ai-review-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'metadata-only' || 'review' }}
  cancel-in-progress: true

# Least privilege: only publishing a commit status. No PR comment is posted, so no pull-requests
# write and no contents access are needed.
permissions:
  statuses: write

env:
  # The published commit-status context. Keep it identical to the branch-protection required check.
  REVIEW_STATUS_CONTEXT: Publish fast review result

jobs:
  route:
    name: Route review to Codex
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish routing status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success -f context="$REVIEW_STATUS_CONTEXT" \
            -f description='Fast-path disabled — routed to Codex for independent review.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Mark routing failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=failure -f context="$REVIEW_STATUS_CONTEXT" \
            -f description='Review routing failed; inspect the run logs' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true
