name: Render

# M2 renderer + generic backend tests (additive; does not modify existing workflows).
# Runs the resolution/backend unit tests and structural checks on the rendered pipeline.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: render-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render-test:
    name: Render test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --only-binary=:all: jsonschema pyyaml
      - name: Renderer + backend tests
        run: |
          python .github/scripts/test_render.py
